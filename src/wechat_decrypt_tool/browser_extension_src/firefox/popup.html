<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { width: 330px; font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 13px; color: #333; margin: 0; padding: 14px 16px; }
  h3 { margin: 0 0 12px; font-size: 15px; color: #1a73e8; }
  .row { margin-bottom: 13px; }
  .row > label { display: block; margin-bottom: 4px; font-weight: bold; }
  .hint { color: #888; font-size: 12px; margin-top: 4px; line-height: 1.55; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; }
  .formats { display: flex; gap: 16px; }
  .formats label { font-weight: normal; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .switch-row { display: flex; align-items: flex-start; gap: 6px; }
  .switch-row label { font-weight: normal; cursor: pointer; line-height: 1.5; }
  button { width: 100%; padding: 8px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; margin-top: 2px; }
  button:hover { background: #1558c0; }
  #status { text-align: center; color: #188038; min-height: 18px; margin-top: 6px; font-size: 12px; }
</style>
</head>
<body>
<h3>AI对话导出 · 保存设置</h3>

<div class="row switch-row">
  <input type="checkbox" id="autoSave" style="margin-top:2px">
  <label for="autoSave">数据拉取完成后自动保存<br>
    <span class="hint">「⏫ 加载全部」或「📚 全部会话」完成后，自动按下面勾选的格式保存，无需再点页面上的格式按钮</span>
  </label>
</div>

<div class="row">
  <label for="saveDir">保存目录</label>
  <input type="text" id="saveDir" placeholder="例如：AI对话导出">
  <div class="hint">浏览器「默认下载文件夹」下的子文件夹，可含多级（如 AI导出/豆包），不存在会自动创建。留空则存到下载文件夹根目录。手动点 JSON/MD/Word 按钮下载时同样保存到这里。</div>
</div>

<div class="row">
  <label>保存格式（可多选）</label>
  <div class="formats">
    <label><input type="checkbox" id="fmtJson"> JSON</label>
    <label><input type="checkbox" id="fmtMd"> Markdown</label>
    <label><input type="checkbox" id="fmtWord"> Word</label>
  </div>
  <div class="hint">Word 依赖在线转换服务，失败不影响其他格式（详见控制台日志）。</div>
</div>

<button id="save">保存设置</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
